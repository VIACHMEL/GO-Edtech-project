{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация · GO</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
<main class="registration-page">
    <h1>Создать аккаунт</h1>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="post" class="registration-form">
        {% csrf_token %}
        <label>Имя <input class="text-input" name="name" value="{{ fields.name }}" autocomplete="name" required maxlength="100"></label>
        <label>Email <input class="text-input" name="email" value="{{ fields.email }}" type="email" autocomplete="email" required maxlength="254"></label>
        <label>Пароль <input class="text-input" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128"></label>
        <p class="field-hint">Не менее 8 символов</p>
        <fieldset class="role-choice">
            <legend>Роль</legend>
            <label><input type="radio" name="role" value="student"{% if fields.role == 'student' %} checked{% endif %} required> Ученик</label>
            <label><input type="radio" name="role" value="teacher"{% if fields.role == 'teacher' %} checked{% endif %}> Преподаватель</label>
        </fieldset>
        <button class="button" type="submit">Зарегистрироваться</button>
    </form>
    <a class="text-link" href="/login/">Уже есть аккаунт? Войти</a>
</main>
</body>
</html>
