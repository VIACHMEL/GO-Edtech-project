{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход · GO</title>
    <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>
<main class="registration-page">
    <h1>Вход</h1>
    {% if error %}<p role="alert">{{ error }}</p>{% endif %}
    <form method="post" class="registration-form">
        {% csrf_token %}
        <label>Логин или email <input class="text-input" name="email" type="text" autocomplete="username" required></label>
        <label>Пароль <input class="text-input" name="password" type="password" autocomplete="current-password" maxlength="128" required></label>
        <button class="button">Войти</button>
    </form>
    <a class="text-link" href="/register/">Создать аккаунт</a>
</main>
</body>
</html>
